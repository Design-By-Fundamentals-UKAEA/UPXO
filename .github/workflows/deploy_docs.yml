name: Deploy Sphinx Docs to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Generate API RST files
        run: |
          sphinx-apidoc -o docs/docs/srcAPIdocs src/upxo --force --separate

      - name: Patch upxo.rst — move module docstring to top
        run: |
          python - <<'EOF'
          import re, pathlib

          path = pathlib.Path("docs/docs/srcAPIdocs/upxo.rst")
          text = path.read_text(encoding="utf-8")

          # ── extract the "Module contents" block ──────────────────────────
          # matches from the "Module contents\n---------..." heading down to
          # (but not including) the next heading or end-of-file
          mc_pattern = re.compile(
              r"(Module contents\n-+\n\n(?:.*\n)*?)"
              r"(?=\n\S.*\n[-=~^]+\n|\Z)",
              re.MULTILINE,
          )
          m = mc_pattern.search(text)
          if not m:
              print("WARNING: 'Module contents' block not found – skipping patch")
              raise SystemExit(0)

          module_block = m.group(1).rstrip("\n") + "\n\n"

          # Remove it from its original position
          text_without = text[:m.start()] + text[m.end():]

          # ── find the end of the title underline (first two lines) ────────
          lines = text_without.splitlines(keepends=True)
          insert_at = 0
          for i, line in enumerate(lines):
              if i > 0 and set(line.strip()) <= set("=-~^"):
                  insert_at = i + 1   # line after the underline
                  break

          # ── insert module block right after the title ─────────────────────
          lines.insert(insert_at, "\n" + module_block + "\n----\n\n")
          path.write_text("".join(lines), encoding="utf-8")
          print("Patched upxo.rst: module docstring moved to top.")
          EOF

      - name: Compile Sphinx HTML
        run: |
          sphinx-build -b html docs docs/_build/html
          touch docs/_build/html/.nojekyll

      - name: Setup GitHub Pages Artifact
        uses: actions/configure-pages@v5

      - name: Upload HTML Content Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

      - name: Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
