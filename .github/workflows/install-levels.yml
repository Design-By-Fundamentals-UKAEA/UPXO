name: Install levels

# Builds the wheel and installs it, as a user would with pip, at each installation level
# (base, viz, mesh, ebsd, all). Runs the import sweep and the level-specific checks in
# .github/scripts/install_check.py from outside the source checkout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"      # Mondays: catches new releases of dependencies

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  levels:
    name: ${{ matrix.level }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        level: [base, viz, mesh, ebsd, all]
        include:
          - { os: ubuntu-latest, python: "3.14", level: all }
          - { os: windows-latest, python: "3.14", level: all }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system libraries for gmsh
        if: runner.os == 'Linux' && (matrix.level == 'mesh' || matrix.level == 'all')
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxcursor1 libxinerama1 libxft2

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/venv/Scripts/python.exe"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          WHEEL=$(ls dist/*.whl)
          if [ "${{ matrix.level }}" = "base" ]; then SPEC="$WHEEL"; else SPEC="$WHEEL[${{ matrix.level }}]"; fi
          "$PY" -m pip install "$SPEC"
          "$PY" -m pip check

      - name: Check the installed package
        working-directory: ${{ runner.temp }}
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: '"$PY" "$GITHUB_WORKSPACE/.github/scripts/install_check.py" ${{ matrix.level }}'

  minimum-versions:
    name: base / every direct dependency at its declared minimum
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the lowest allowed versions
        run: |
          pip install uv
          uv venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          WHEEL=$(ls dist/*.whl)
          python .github/scripts/install_check.py --base-requirements "$WHEEL" > "$RUNNER_TEMP/requirements.txt"
          # netlsd is published as a source distribution only
          uv pip install --python "$PY" --resolution lowest-direct --only-binary :all: --no-binary netlsd -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$PY" --no-deps "$WHEEL"
          uv pip check --python "$PY"
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Check the installed package
        working-directory: ${{ runner.temp }}
        run: '"$PY" "$GITHUB_WORKSPACE/.github/scripts/install_check.py" base'
