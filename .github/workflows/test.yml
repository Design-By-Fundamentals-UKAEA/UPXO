name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          # Install the package in editable mode without optional extras.
          # pyvista[jupyter] (which requires VTK/OpenGL) is excluded here
          # because the test suite does not exercise any visualisation code.
          pip install -e . --no-deps
          pip install \
            numpy scipy matplotlib pandas \
            numba \
            networkx \
            scikit-image scikit-learn \
            shapely \
            tqdm seaborn colorama termcolor \
            connected-components-3d \
            xlrd openpyxl ipywidgets \
            pytest

      - name: Run tests
        run: pytest tests/ -v
