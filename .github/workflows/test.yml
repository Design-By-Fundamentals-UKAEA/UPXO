name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          # Install the package in editable mode with its core dependencies
          # (includes pyvista, which several core pxtal/geoEntities modules
          # need just to be importable, not only for visualisation).
          pip install -e .
          # tetgen and gmsh are optional [mesh] extras but are genuinely
          # imported by vortess3d.py and the gbconformant/d3v2p0 mesh tests.
          # rasterio/defdap/pyvoro/plotly are NOT needed -- rasterio's only
          # use (geometrification.py's polygonize()) is a lazy import, and
          # nothing in tests/ exercises defdap/pyvoro/plotly-dependent code.
          pip install tetgen "gmsh>=4.13" pytest

      - name: Run tests
        run: pytest tests/ -v -m "not gui and not slow"
