name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install upxo and test dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
