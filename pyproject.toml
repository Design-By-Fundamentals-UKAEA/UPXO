[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upxo"
version = "1.0.0"
description = "An open-source Python package for generation, analysis, assessment, visualisation, meshing, and export of representative polycrystalline grain structures."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-only"
authors = [
    { name = "Dr. Sunil Anandatheertha", email = "vaasu.anandatheertha@ukaea.uk" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "pandas>=2.3.3",
    "numba>=0.62.1",
    "networkx>=3.5",
    "pyvista>=0.46.3",
    "vtk>=9.5.2",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
    "seaborn>=0.13.2",
    "defdap==0.93.6",
]

[project.urls]
Repository = "https://github.com/Design-By-Fundamentals-UKAEA/UPXO"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]