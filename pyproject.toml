[tool.pytest.ini_options]
filterwarnings = [
    # Numba's Python-level TypedDict accessor internally casts int32 keys
    # to Python int (int64) during iteration — upstream Numba behaviour.
    "ignore::numba.core.errors.NumbaTypeSafetyWarning",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "upxo"
version = "1.1.0"
description = "An open-source Python package for generation, analysis, assessment, visualisation, meshing, and export of representative polycrystalline grain structures."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
authors = [
    { name = "Dr. Sunil Anandatheertha", email = "vaasu.anandatheertha@ukaea.uk" }
]
contributors = [
    { name = "Dr. Vikram Phalke", email = "vikram.phalke@ukaea.uk" },
    { name = "Dr. Chris Hardie", email = "chris.hardie@ukaea.uk" },
    { name = "Dr. Eralp Demir" }
]
keywords = [
    "polycrystal",
    "grain-structure",
    "microstructure",
    "finite-element",
    "materials-science",
    "monte-carlo",
    "voronoi",
    "fem",
    "fe-simulation",
    "nuclear-materials",
    "ferritic-martensitic-steel",
    "copper",
    "twinned-microstructure",
    "ebsd"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Materials Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.16.2",
    "matplotlib>=3.10.6",
    "pandas>=2.3.3",
    "numba>=0.62.1",
    "networkx>=3.5",
    "pyvista[jupyter]>=0.46.3",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "shapely>=2.1.1",
    "tqdm>=4.67.1",
    "seaborn>=0.13.2",
    "colorama>=0.4.6",
    "termcolor>=2.4.0",
    "connected-components-3d>=3.26.1",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.0",
    "ipywidgets>=8.0.0",
]

[project.optional-dependencies]
viz  = ["plotly>=5.0.0"]
mesh = ["pyvoro>=1.3.2", "tetgen>=0.8.2"]
io   = ["rasterio>=1.4.3"]
ebsd = ["defdap==0.93.6"]
all  = ["upxo[viz,mesh,io,ebsd]"]

[tool.setuptools.package-data]
"*" = ["*.xls", "*.xlsx", "*.m"]

[project.urls]
Homepage = "https://github.com/Design-By-Fundamentals-UKAEA/UPXO"
Repository = "https://github.com/Design-By-Fundamentals-UKAEA/UPXO"
Documentation = "https://design-by-fundamentals-ukaea.github.io/UPXO/"
Wiki = "https://github.com/Design-By-Fundamentals-UKAEA/UPXO/wiki"
"Bug Tracker" = "https://github.com/Design-By-Fundamentals-UKAEA/UPXO/issues"
Changelog = "https://github.com/Design-By-Fundamentals-UKAEA/UPXO/blob/main/CHANGELOG.md"
"YouTube Channel" = "https://www.youtube.com/@UPXODBF"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]